name: gas365
services:
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    mem_limit: 128m
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gas365}
      POSTGRES_DB: ${POSTGRES_DB:-gas365}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/bootstrap.mjs --env-only first}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
  api:
    image: gas365-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DataProtection__KeyPath: /keys
      Mail__Host: mailpit
      Mail__Port: 1025
      Mail__PublicOrigin: http://localhost:${WEB_PORT:-8080}
      # Local development sweeps alerts more often than the 60-second production default.
      Notifications__SweepSeconds: 15
      # Local platform administrator for development and browser tests; set the real address per environment.
      Platform__AdminEmails: ${PLATFORM_ADMIN_EMAILS:-platform-admin@test.example}
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-gas365};Username=${POSTGRES_USER:-gas365};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};Timeout=5
    ports:
      - '127.0.0.1:${API_PORT:-5080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'dotnet', 'Gas365.Api.dll', '--health-probe']
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s
    read_only: true
    volumes:
      - identity-keys:/keys
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
  web:
    image: gas365-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/health/live']
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
  migrate:
    image: gas365-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    command: ['--migrate']
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Database=${POSTGRES_DB:-gas365};Username=${POSTGRES_USER:-gas365};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};Timeout=5
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
volumes:
  postgres-data:
  identity-keys:
